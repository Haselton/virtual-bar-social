name: Build Godot 3D Android APK
on:
  push:
    branches: [ main ]
    paths: [ 'godot/**', '.github/workflows/godot-android.yml' ]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable/ || true
      - name: Export Android
        working-directory: godot
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/virtual-bar-3d.apk
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-bar-3d-apk
          path: godot/build/virtual-bar-3d.apk
