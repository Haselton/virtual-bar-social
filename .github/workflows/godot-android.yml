name: Build Godot 3D Android APK
on:
  push:
    branches: [ main ]
    paths: [ 'godot/**', '.github/workflows/godot-android.yml' ]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android export
        run: |
          mkdir -p /root/.config/godot
          test -f /root/debug.keystore || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          godot --headless --editor --quit --path godot --editor-settings android/java_sdk_path=/usr/lib/jvm/java-17-openjdk-amd64 android/android_sdk_path=$ANDROID_HOME || true
      - name: Export Android
        working-directory: godot
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/virtual-bar-3d.apk
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-bar-3d-apk
          path: godot/build/virtual-bar-3d.apk
